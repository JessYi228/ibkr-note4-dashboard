[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ibkr-note4-dashboard"
version = "0.1.0"
description = "Read-only IBKR portfolio dashboard for the ZECTRIX NOTE4 e-paper display"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JessYi228" }]
keywords = ["ibkr", "zectrix", "note4", "e-paper", "portfolio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["Pillow>=9.4,<12"]

[project.scripts]
ibkr-note4 = "ibkr_note4.cli:main"

[project.urls]
Homepage = "https://github.com/JessYi228/ibkr-note4-dashboard"
Issues = "https://github.com/JessYi228/ibkr-note4-dashboard/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ibkr_note4 = ["assets/*.json"]
